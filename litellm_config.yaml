# NOTE: Keep this file ASCII/UTF-8 clean to avoid Windows cp1252 decode issues.
model_list:
  # Context normalization / SPEC generation (strict JSON)
  # Nota: para forzar mejor cumplimiento de plantilla/estructura, usamos Mistral aquí.
  - model_name: ctx-json
    hidden: false
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: ctx-json-groq
    hidden: false
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  - model_name: ctx-json-gemini
    hidden: false
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: ctx-json-openrouter
    hidden: false
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY


  # Classification/decision (JSON)
  # Nota: usamos Mistral para mejorar cumplimiento de JSON estructurado.
  - model_name: cls-json
    hidden: false
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: cls-json-groq
    hidden: false
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  - model_name: cls-json-gemini
    hidden: false
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: cls-json-openrouter
    hidden: false
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  # Code generation
  # Primary: Mistral (codestral-latest)
  # Fallback: OpenRouter - handled by proxy routing below
  - model_name: code-gen
    hidden: false
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY

  # Code generation fallback target (do not call directly; used by routing)
  - model_name: code-gen-fallback
    hidden: false
    litellm_params:
      # OpenRouter fallback (reemplaza a Cerebras: la cuenta requiere billing y fallaba siempre).
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  # Documentation (text)
  # Reparto de carga: OpenRouter y Mistral antes que Gemini/Groq.
  - model_name: docs
    hidden: false
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: docs-mistral
    hidden: false
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: docs-gemini
    hidden: false
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: docs-openrouter-2
    hidden: false
    litellm_params:
      # Segundo fallback OpenRouter (reemplaza a Cerebras: la cuenta requiere billing y fallaba siempre).
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: docs-groq
    hidden: false
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  # Estimates (text/short)
  - model_name: estimate
    hidden: false
    litellm_params:
      # OpenRouter (reemplaza a Cerebras: la cuenta requiere billing y fallaba siempre).
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: estimate-gemini
    hidden: false
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: estimate-groq
    hidden: false
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  - model_name: estimate-openrouter
    hidden: false
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  # Separate alias for Groq large model (optional)
  - model_name: groq-big
    hidden: false
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

# Proxy-level fallback routing (requires LiteLLM Proxy version that supports this field)
# When calling "code-gen", if Mistral errors, route to "code-gen-fallback" (OpenRouter).
# Router/fallbacks (LiteLLM Router)
# Nota: en LiteLLM Proxy moderno, los fallbacks se definen con `router_settings.model_group_alias`.
# Esto es lo que hace que en logs aparezca "Available Model Group Fallbacks=...".
router_settings:
  # Importante: en LiteLLM 1.84.x `model_group_alias` sólo define alias -> deployment base.
  # Los fallbacks/orden de preferencia se define con `model_group_fallbacks`.
  model_group_alias:
    ctx-json:
      model: ctx-json
      hidden: false

    cls-json:
      model: cls-json
      hidden: false

    docs:
      model: docs
      hidden: false

    estimate:
      model: estimate
      hidden: false

    code-gen:
      model: code-gen
      hidden: false

  # Fallbacks / orden de preferencia por alias.
  #
  # En tu firma de Router.__init__ NO existe `model_group_fallbacks`, pero SI existe `fallbacks`
  # (y `default_fallbacks`). Por eso el proxy estaba ignorando `model_group_fallbacks`.
  #
  # Sintaxis de `fallbacks` en Router (la que valida tu versión):
  #   - lista de diccionarios, donde cada item tiene una sola clave:
  #       { "<model_group>": ["fallback1", "fallback2", ...] }
  fallbacks:
    - ctx-json:
        - ctx-json-groq
        - ctx-json-gemini
        - ctx-json-openrouter

    - cls-json:
        - cls-json-groq
        - cls-json-gemini
        - cls-json-openrouter

    - docs:
        # Orden requerido:
        # 1) OpenRouter (primary del grupo: model_name "docs")
        # 2) OpenRouter (segundo fallback, reemplaza a Cerebras)
        # 3) Mistral
        - docs-gemini
        - docs-groq
        - docs-openrouter-2
        - docs-mistral

    - estimate:
        - estimate-gemini
        - estimate-groq
        - estimate-openrouter

    - code-gen:
        - code-gen-fallback
